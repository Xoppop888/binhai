name: Sync cars from bhgjauto.com

on:
  schedule:
    # каждые 6 часов; поменяйте на свой интервал (cron в UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: {} # кнопка "Run workflow" в вкладке Actions — запуск вручную

jobs:
  parse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install headless Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Run parser
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run parse
