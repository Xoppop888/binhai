<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>BINHAI AUTO — Автомобили из Китая под ключ</title>
    <meta name="description" content="BINHAI AUTO — импорт автомобилей из Китая под ключ. Подбор, проверка, растаможка и доставка по всей России." />

    <!-- Превью при пересылке ссылки в WhatsApp / Telegram / VK -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BINHAI AUTO" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="BINHAI AUTO — Автомобили из Китая под ключ" />
    <meta property="og:description" content="Подбор, проверка, растаможка и доставка автомобилей из Китая по всей России." />
    <meta property="og:image" content="https://binhaiauto.ru/hero-car-carrier.png" />
    <meta property="og:url" content="https://binhaiauto.ru/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BINHAI AUTO — Автомобили из Китая под ключ" />
    <meta name="twitter:description" content="Подбор, проверка, растаможка и доставка автомобилей из Китая по всей России." />
    <meta name="twitter:image" content="https://binhaiauto.ru/hero-car-carrier.png" />
    <style>
      /* Показывается мгновенно, ещё до загрузки JS — чтобы не было белого
         экрана на медленном мобильном интернете. React сам уберёт этот div,
         как только смонтируется (перезапишет содержимое #root). */
      .boot-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: 'DM Sans', Arial, sans-serif;
        color: #718087;
        background: #f4f6f5;
      }
      .boot-loader .ring {
        width: 34px;
        height: 34px;
        border: 3px solid #dce8e6;
        border-top-color: #0d6470;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader"><div class="ring"></div><p>BINHAI AUTO</p></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
